[RegexGuide]
GuideContent========== Regex Guide ==========\r\n\r\nThis tool uses C++ std::regex with default ECMAScript syntax (compatible with JavaScript regex).\r\n\r\n[Basic Syntax]\r\n  .        Match any single character (except newline)\r\n  \\d       Match any digit [0-9]\r\n  \\D       Match non-digit\r\n  \\w       Match letter, digit, underscore [a-zA-Z0-9_]\r\n  \\W       Match non-word character\r\n  \\s       Match whitespace (space, tab, etc.)\r\n  \\S       Match non-whitespace\r\n  [abc]    Match a, b, or c\r\n  [^abc]   Match any character except a, b, c\r\n  [a-z]    Match lowercase letters a to z\r\n\r\n[Quantifiers]\r\n  *        0 or more\r\n  +        1 or more\r\n  ?        0 or 1\r\n  {n}      Exactly n times\r\n  {n,}     At least n times\r\n  {n,m}    n to m times\r\n\r\n[Anchors]\r\n  ^        Start of string\r\n  $        End of string\r\n  \\b       Word boundary\r\n\r\n[Groups and Replacement]\r\n  (pattern)      Capturing group, reference in replacement\r\n  (?:pattern)    Non-capturing group\r\n  $1, $2, ...    Reference 1st, 2nd capturing group in replacement\r\n  $&             Reference entire match in replacement\r\n\r\n[Common Examples]\r\n  Remove all digits:\r\n    Find: \\d+    Replace: (empty)\r\n\r\n  Remove leading number (e.g. \"01_\"):\r\n    Find: ^\\d+_    Replace: (empty)\r\n\r\n  Change \"IMG_001\" to \"Photo_001\":\r\n    Find: ^IMG    Replace: Photo\r\n\r\n  Swap \"name_date\" to \"date_name\":\r\n    Find: ^(\\w+)_(\\w+)$    Replace: $2_$1\r\n\r\n  Remove parentheses and content:\r\n    Find: \\(.*?\\)    Replace: (empty)\r\n\r\n  Remove trailing number \"(1)\", \"(2)\":\r\n    Find: \\(\\d+\\)$    Replace: (empty)\r\n\r\n  Replace spaces with underscores:\r\n    Find: \\s+    Replace: _\r\n\r\n[Notes]\r\n  - Replacement only applies to filename stem (without extension)\r\n  - Extension will not be modified\r\n  - If regex is invalid, replacement rules will be ignored\r\n  - Special characters need escaping: . * + ? ( ) [ ] { } \\ ^ $ |